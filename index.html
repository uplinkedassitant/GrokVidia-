<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok — xAI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --bg2: #141414;
    --bg3: #1a1a1a;
    --bg4: #222222;
    --border: #2a2a2a;
    --border2: #333333;
    --text: #e8e8e8;
    --text2: #999999;
    --text3: #666666;
    --accent: #ff4545;
    --accent2: #ff6b6b;
    --user-bubble: #1c1c1c;
    --sidebar-w: 260px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    text-decoration: none;
    flex: 1;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 900;
    color: white;
    letter-spacing: -1px;
  }

  .new-chat-btn {
    width: 30px; height: 30px;
    border: 1px solid var(--border2);
    background: transparent;
    border-radius: 6px;
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all 0.15s;
  }
  .new-chat-btn:hover { background: var(--bg4); color: var(--text); }

  .sidebar-search {
    padding: 12px 12px 8px;
  }

  .sidebar-search input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .sidebar-search input:focus { border-color: var(--border2); }
  .sidebar-search input::placeholder { color: var(--text3); }

  .sidebar-section { padding: 8px 12px 4px; }
  .sidebar-section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 0 4px;
    margin-bottom: 4px;
  }

  .chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .chat-list::-webkit-scrollbar { width: 4px; }
  .chat-list::-webkit-scrollbar-track { background: transparent; }
  .chat-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
    font-size: 13px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item:hover { background: var(--bg3); color: var(--text); }
  .chat-item.active { background: var(--bg4); color: var(--text); }
  .chat-item svg { flex-shrink: 0; opacity: 0.5; }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .profile-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .profile-row:hover { background: var(--bg3); }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff4545, #ff8c42);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: white;
    flex-shrink: 0;
  }

  .profile-info { flex: 1; overflow: hidden; }
  .profile-name { font-size: 13px; font-weight: 600; }
  .profile-plan { font-size: 11px; color: var(--text3); }

  /* ─── MAIN ─── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  /* ─── TOP BAR ─── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .model-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    transition: border-color 0.15s;
  }
  .model-selector:hover { border-color: var(--border2); }
  .model-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .topbar-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 8px;
    color: var(--text2);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .topbar-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }

  .api-btn {
    border-color: var(--accent);
    color: var(--accent);
  }
  .api-btn:hover { background: rgba(255,69,69,0.1); color: var(--accent2); border-color: var(--accent2); }

  /* ─── MESSAGES ─── */
  .messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 0;
    scroll-behavior: smooth;
  }
  .messages-container::-webkit-scrollbar { width: 6px; }
  .messages-container::-webkit-scrollbar-track { background: transparent; }
  .messages-container::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .messages-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 24px 8px;
  }

  /* Welcome screen */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
    text-align: center;
    padding: 40px 24px;
  }

  .welcome-logo {
    width: 56px; height: 56px;
    background: var(--accent);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: white;
    margin-bottom: 8px;
    letter-spacing: -1px;
  }

  .welcome h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .welcome p {
    color: var(--text2);
    font-size: 15px;
    max-width: 380px;
    line-height: 1.6;
    margin-top: 4px;
  }

  .suggestion-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 28px;
    width: 100%;
    max-width: 580px;
  }

  .suggestion-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-family: inherit;
    color: var(--text2);
    font-size: 13px;
    line-height: 1.5;
  }
  .suggestion-card:hover {
    background: var(--bg3);
    border-color: var(--border2);
    color: var(--text);
  }
  .suggestion-card strong {
    display: block;
    color: var(--text);
    font-weight: 600;
    margin-bottom: 2px;
    font-size: 13px;
  }

  /* Message bubbles */
  .message {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 28px;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.user { align-items: flex-end; }
  .message.assistant { align-items: flex-start; }

  .message-role {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text3);
    margin-bottom: 6px;
    padding: 0 4px;
  }

  .message.user .message-role { color: var(--accent); }

  .message-bubble {
    max-width: 82%;
    padding: 13px 17px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.65;
    word-break: break-word;
  }

  .message.user .message-bubble {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-bottom-right-radius: 4px;
  }

  .message.assistant .message-bubble {
    background: transparent;
    padding: 0 4px;
    border: none;
    max-width: 100%;
    color: var(--text);
  }

  .message-bubble p { margin-bottom: 10px; }
  .message-bubble p:last-child { margin-bottom: 0; }

  .message-bubble code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--bg3);
    padding: 2px 6px;
    border-radius: 4px;
    color: #ff9a5c;
  }

  .message-bubble pre {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 10px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
  }
  .message-bubble pre code { background: transparent; padding: 0; color: #cdd6f4; }

  .message-actions {
    display: flex;
    gap: 4px;
    margin-top: 8px;
    padding: 0 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .message:hover .message-actions { opacity: 1; }

  .action-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 8px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text3);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .action-btn:hover { background: var(--bg3); border-color: var(--border); color: var(--text2); }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 5px;
    padding: 10px 4px;
    align-items: center;
  }
  .typing span {
    width: 7px; height: 7px;
    background: var(--text3);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ─── INPUT AREA ─── */
  .input-area {
    flex-shrink: 0;
    padding: 14px 20px 18px;
    background: var(--bg);
  }

  .input-wrapper {
    max-width: 760px;
    margin: 0 auto;
  }

  .input-box {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 14px 16px;
    transition: border-color 0.15s;
    position: relative;
  }
  .input-box:focus-within { border-color: #444; }

  .input-box textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    resize: none;
    min-height: 24px;
    max-height: 200px;
    overflow-y: auto;
  }
  .input-box textarea::placeholder { color: var(--text3); }
  .input-box textarea::-webkit-scrollbar { width: 4px; }
  .input-box textarea::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .input-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
  }

  .input-tools { display: flex; gap: 4px; }

  .tool-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text3);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s;
    font-weight: 500;
  }
  .tool-btn:hover { background: var(--bg3); border-color: var(--border); color: var(--text2); }

  .send-btn {
    width: 36px; height: 36px;
    background: var(--text);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #fff; transform: scale(1.04); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .input-note {
    text-align: center;
    font-size: 11.5px;
    color: var(--text3);
    margin-top: 10px;
  }

  /* ─── API KEY MODAL ─── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 18px;
    padding: 28px;
    width: 440px;
    max-width: calc(100vw - 40px);
    transform: scale(0.95) translateY(10px);
    transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }

  .modal h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .modal p {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .modal-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: block;
  }

  .modal-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.15s;
  }
  .modal-input:focus { border-color: #555; }
  .modal-input::placeholder { color: var(--text3); font-family: 'Sora', sans-serif; }

  .modal-select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    margin-bottom: 20px;
    cursor: pointer;
    appearance: none;
  }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .modal-cancel {
    padding: 9px 18px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 10px;
    color: var(--text2);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-select optgroup { color: var(--text3); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-select option { color: var(--text); background: var(--bg3); font-size: 13px; }

  .modal-save {
    padding: 9px 20px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: white;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-save:hover { background: var(--accent2); }

  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-dot.green { background: #22c55e; }
  .status-dot.red { background: var(--accent); }

  .nvidia-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(118,185,0,0.1);
    border: 1px solid rgba(118,185,0,0.3);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 600;
    color: #76b900;
    margin-bottom: 16px;
  }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .suggestion-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <a class="logo" href="#">
      <div class="logo-icon">𝕏</div>
      Grok
    </a>
    <button class="new-chat-btn" onclick="newChat()" title="New chat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <div class="sidebar-search">
    <input type="text" placeholder="Search conversations...">
  </div>

  <div class="chat-list" id="chatList">
    <div class="sidebar-section">
      <div class="sidebar-section-label">Today</div>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="profile-row">
      <div class="avatar">U</div>
      <div class="profile-info">
        <div class="profile-name">You</div>
        <div class="profile-plan">NVIDIA API</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <!-- TOP BAR -->
  <div class="topbar">
    <button class="model-selector" onclick="openModal()">
      <div class="model-dot" id="statusDot" style="background:#666"></div>
      <span id="modelLabel">Select Model</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="newChat()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
      <button class="topbar-btn api-btn" onclick="openModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3h-8l-1 4h10z"/></svg>
        API Key
      </button>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages-container" id="messagesContainer">
    <div class="messages-inner" id="messagesInner">
      <!-- Welcome shown initially -->
      <div class="welcome" id="welcome">
        <div class="welcome-logo">𝕏</div>
        <h1>What's on your mind?</h1>
        <p>Ask me anything. Powered by NVIDIA's AI models via the NIM API.</p>
        <div class="suggestion-grid">
          <button class="suggestion-card" onclick="sendSuggestion(this)">
            <strong>Explain quantum computing</strong>
            in plain terms for a beginner
          </button>
          <button class="suggestion-card" onclick="sendSuggestion(this)">
            <strong>Write a Python script</strong>
            to scrape and parse a website
          </button>
          <button class="suggestion-card" onclick="sendSuggestion(this)">
            <strong>What are the biggest</strong>
            AI breakthroughs of 2025?
          </button>
          <button class="suggestion-card" onclick="sendSuggestion(this)">
            <strong>Give me a workout plan</strong>
            for building muscle at home
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-wrapper">
      <div class="input-box">
        <textarea
          id="inputBox"
          placeholder="Ask Grok anything..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <div class="input-footer">
          <div class="input-tools">
            <button class="tool-btn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              Search
            </button>
            <button class="tool-btn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              Think
            </button>
            <button class="tool-btn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              Image
            </button>
          </div>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
      <div class="input-note">Grok can make mistakes. Verify important information.</div>
    </div>
  </div>
</main>

<!-- API KEY MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="nvidia-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="#76b900"><circle cx="12" cy="12" r="10"/></svg>
      NVIDIA NIM API
    </div>
    <h2>Configure API</h2>
    <p>Enter your NVIDIA API key to power Grok with NVIDIA's language models.</p>

    <label class="modal-label">NVIDIA API Key</label>
    <input class="modal-input" type="password" id="apiKeyInput" placeholder="nvapi-xxxxxxxxxxxxxxxxxxxxxxxx">

    <label class="modal-label">Model</label>
    <select class="modal-select" id="modelSelect">
      <optgroup label="⭐ Featured">
        <option value="minimaxai/minimax-m2.5">MiniMax M2.5 (230B MoE) — Reasoning + Coding</option>
        <option value="qwen/qwen3-235b-a22b">Qwen3 235B-A22B (MoE) — Advanced Reasoning</option>
      </optgroup>
      <optgroup label="Meta Llama">
        <option value="meta/llama-3.3-70b-instruct">Meta Llama 3.3 70B Instruct</option>
        <option value="meta/llama-3.1-405b-instruct">Meta Llama 3.1 405B Instruct</option>
      </optgroup>
      <optgroup label="NVIDIA">
        <option value="nvidia/llama-3.1-nemotron-70b-instruct">NVIDIA Nemotron 70B</option>
      </optgroup>
      <optgroup label="Other">
        <option value="mistralai/mistral-large-2-instruct">Mistral Large 2</option>
        <option value="google/gemma-3-27b-it">Google Gemma 3 27B</option>
        <option value="qwen/qwen2.5-72b-instruct">Qwen 2.5 72B</option>
        <option value="deepseek-ai/deepseek-r1">DeepSeek R1</option>
      </optgroup>
    </select>

    <label class="modal-label" style="display:flex;align-items:center;justify-content:space-between;">
      System Prompt
      <select id="presetSelect" onchange="applyPreset()" style="font-family:inherit;font-size:11px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:3px 8px;color:var(--text2);cursor:pointer;outline:none;">
        <option value="">— Presets —</option>
        <option value="You are a helpful, accurate, and concise assistant.">Default Assistant</option>
        <option value="You are an expert software engineer. Write clean, well-commented code. Prefer modern best practices and explain your reasoning.">Software Engineer</option>
        <option value="You are a creative writing partner. Help craft vivid, engaging stories with strong characters and compelling narratives.">Creative Writer</option>
        <option value="You are a data analyst. Help interpret data, suggest visualizations, write SQL/Python, and explain findings clearly.">Data Analyst</option>
        <option value="You are a Socratic tutor. Never give direct answers — instead guide the user to discover answers themselves through questions.">Socratic Tutor</option>
        <option value="You are a blunt, no-nonsense assistant. Skip pleasantries. Give direct answers only. No filler, no disclaimers.">No-Nonsense Mode</option>
        <option value="custom">Custom…</option>
      </select>
    </label>
    <textarea
      class="modal-input"
      id="systemPromptInput"
      placeholder="e.g. You are a helpful assistant that responds only in haiku..."
      rows="4"
      style="resize:vertical;min-height:90px;font-family:inherit;font-size:13px;line-height:1.5;"
    ></textarea>

    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" onclick="saveConfig()">Save & Connect</button>
    </div>
  </div>
</div>

<script>
  // ── State ──
  let apiKey = localStorage.getItem('nvidia_api_key') || '';
  let selectedModel = localStorage.getItem('nvidia_model') || 'minimaxai/minimax-m2.5';
  let systemPrompt = localStorage.getItem('nvidia_system_prompt') || '';
  let conversations = [];
  let isGenerating = false;

  const textarea = document.getElementById('inputBox');
  const sendBtn = document.getElementById('sendBtn');
  const messagesInner = document.getElementById('messagesInner');
  const welcome = document.getElementById('welcome');
  const modelLabel = document.getElementById('modelLabel');
  const statusDot = document.getElementById('statusDot');
  const chatList = document.getElementById('chatList');

  // ── Init ──
  function init() {
    if (apiKey) {
      updateStatus(true);
    }
    document.getElementById('apiKeyInput').value = apiKey;
    document.getElementById('modelSelect').value = selectedModel;
    document.getElementById('systemPromptInput').value = systemPrompt;
    updateModelLabel();
    textarea.addEventListener('input', () => {
      sendBtn.disabled = !textarea.value.trim() || isGenerating;
    });
  }

  function updateModelLabel() {
    const sel = document.getElementById('modelSelect');
    const opt = sel.querySelector(`option[value="${selectedModel}"]`);
    const raw = opt ? opt.text : selectedModel;
    // Strip description after em dash, truncate to 32 chars
    const clean = raw.split('—')[0].trim();
    modelLabel.textContent = clean.length > 32 ? clean.slice(0, 30) + '…' : clean;
  }

  function updateStatus(connected) {
    statusDot.style.background = connected ? '#22c55e' : '#666';
  }

  // ── Modal ──
  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }
  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }
  function saveConfig() {
    const key = document.getElementById('apiKeyInput').value.trim();
    const model = document.getElementById('modelSelect').value;
    const sp = document.getElementById('systemPromptInput').value.trim();
    if (!key) { alert('Please enter an API key.'); return; }
    apiKey = key;
    selectedModel = model;
    systemPrompt = sp;
    localStorage.setItem('nvidia_api_key', key);
    localStorage.setItem('nvidia_model', model);
    localStorage.setItem('nvidia_system_prompt', sp);
    updateStatus(true);
    updateModelLabel();
    closeModal();
  }

  function applyPreset() {
    const sel = document.getElementById('presetSelect');
    const val = sel.value;
    if (!val || val === 'custom') return;
    document.getElementById('systemPromptInput').value = val;
    sel.value = '';
  }

  // ── Chat ──
  function newChat() {
    conversations = [];
    messagesInner.innerHTML = '';
    messagesInner.appendChild(welcome);
    welcome.style.display = 'flex';
  }

  function sendSuggestion(btn) {
    const strong = btn.querySelector('strong').textContent;
    const rest = btn.childNodes[btn.childNodes.length - 1].textContent.trim();
    textarea.value = strong + ' ' + rest;
    sendMessage();
  }

  async function sendMessage() {
    const text = textarea.value.trim();
    if (!text || isGenerating) return;

    if (!apiKey) {
      openModal();
      return;
    }

    // Hide welcome
    welcome.style.display = 'none';

    // Append user message
    conversations.push({ role: 'user', content: text });
    appendMessage('user', text);

    textarea.value = '';
    autoResize(textarea);
    sendBtn.disabled = true;
    isGenerating = true;

    // Add to sidebar
    addToSidebar(text);

    // Typing indicator
    const typingEl = document.createElement('div');
    typingEl.className = 'message assistant';
    typingEl.innerHTML = `<div class="message-role">Grok</div><div class="typing"><span></span><span></span><span></span></div>`;
    messagesInner.appendChild(typingEl);
    scrollToBottom();

    try {
      const response = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: selectedModel,
          messages: systemPrompt ? [{ role: 'system', content: systemPrompt }, ...conversations] : conversations,
          temperature: 1,
          top_p: 0.95,
          max_tokens: 8192,
          stream: true
        })
      });

      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        let errMsg = `API error ${response.status}`;
        try {
          const errJson = JSON.parse(errText);
          errMsg = errJson?.detail || errJson?.message || errJson?.error?.message || errMsg;
        } catch {}
        throw new Error(errMsg);
      }

      // Remove typing indicator now that the stream is open
      typingEl.remove();

      // Create the assistant message bubble
      const msgEl = appendMessage('assistant', '', true);
      const bubbleEl = msgEl.querySelector('.message-bubble');

      let fullText = '';
      let buffer = '';
      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        // Process all complete lines; keep last incomplete line in buffer
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;
          const data = trimmed.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            // Guard: some chunks have empty choices (e.g. MiniMax usage events)
            if (!parsed.choices || parsed.choices.length === 0) continue;
            const delta = parsed.choices[0]?.delta?.content;
            if (delta == null) continue;
            fullText += delta;
            bubbleEl.innerHTML = formatText(fullText);
            scrollToBottom();
          } catch { /* malformed chunk — skip */ }
        }
      }

      // Flush any remaining buffered data
      if (buffer.trim().startsWith('data:')) {
        const data = buffer.trim().slice(5).trim();
        if (data && data !== '[DONE]') {
          try {
            const parsed = JSON.parse(data);
            if (parsed.choices?.length > 0) {
              const delta = parsed.choices[0]?.delta?.content;
              if (delta) { fullText += delta; bubbleEl.innerHTML = formatText(fullText); }
            }
          } catch {}
        }
      }

      conversations.push({ role: 'assistant', content: fullText });

    } catch (err) {
      typingEl.remove();
      appendMessage('assistant', `⚠️ **Error:** ${err.message}\n\nDouble-check your API key and make sure the selected model is available on your NVIDIA NIM account.`);
      console.error('NVIDIA API error:', err);
    }

    isGenerating = false;
    sendBtn.disabled = !textarea.value.trim();
  }

  function appendMessage(role, text, empty = false) {
    const el = document.createElement('div');
    el.className = `message ${role}`;
    const label = role === 'user' ? 'You' : 'Grok';
    el.innerHTML = `
      <div class="message-role">${label}</div>
      <div class="message-bubble">${empty ? '' : formatText(text)}</div>
      ${role === 'assistant' ? `
      <div class="message-actions">
        <button class="action-btn" onclick="copyMsg(this)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
        <button class="action-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
          Retry
        </button>
      </div>` : ''}
    `;
    messagesInner.appendChild(el);
    scrollToBottom();
    return el;
  }

  function copyMsg(btn) {
    const bubble = btn.closest('.message').querySelector('.message-bubble');
    navigator.clipboard.writeText(bubble.innerText);
    btn.textContent = 'Copied!';
    setTimeout(() => {
      btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
    }, 1500);
  }

  function formatText(text) {
    // Code blocks
    text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escHtml(code.trim())}</code></pre>`
    );
    // Inline code
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Paragraphs
    text = text.split('\n\n').map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '').join('');
    return text || text;
  }

  function escHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function addToSidebar(text) {
    const existing = document.querySelectorAll('.chat-item');
    existing.forEach(e => e.classList.remove('active'));

    const item = document.createElement('div');
    item.className = 'chat-item active';
    const preview = text.length > 36 ? text.slice(0, 36) + '…' : text;
    item.innerHTML = `
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      ${preview}
    `;
    const section = chatList.querySelector('.sidebar-section');
    section.after(item);
  }

  function scrollToBottom() {
    const c = document.getElementById('messagesContainer');
    c.scrollTop = c.scrollHeight;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  }

  // ── Start ──
  init();

  // Auto-open modal if no key
  if (!apiKey) setTimeout(openModal, 600);
</script>
</body>
</html>
